<!-- Supabase 대시보드 > Authentication > Emails(Email Templates) > "Change email address"
     제목(Subject):  [ooro.] 이메일 변경을 확인해 주세요
     아래 내용을 본문(Message body)에 붙여넣으세요. -->
<div style="max-width:480px;margin:0 auto;padding:32px 24px;background:#f1eee6;color:#7a6855;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.7;">
  <p style="margin:0 0 24px;font-size:22px;font-weight:700;">ooro.</p>
  <p style="margin:0 0 8px;font-size:18px;font-weight:700;">이메일 변경을 확인해 주세요</p>
  <p style="margin:0 0 24px;font-size:14px;">로그인 이메일을 <b>{{ .NewEmail }}</b>(으)로 바꾸려는 요청이 있었어요. 아래 버튼을 누르면 변경이 완료돼요.</p>
  <p style="margin:0 0 24px;">
    <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email_change"
       style="display:inline-block;padding:14px 28px;background:#7a6855;color:#fcfbf8;border-radius:999px;text-decoration:none;font-size:14px;font-weight:600;">
      이메일 변경 확인
    </a>
  </p>
  <p style="margin:0;font-size:12px;">본인이 요청한 게 아니라면 이 메일을 무시해 주세요.</p>
</div>
