<!-- Supabase 대시보드 > Authentication > Emails(Email Templates) > "Reset password"
     제목(Subject):  [ooro.] 비밀번호 재설정 링크예요
     아래 내용을 본문(Message body)에 붙여넣으세요. -->
<div style="max-width:480px;margin:0 auto;padding:32px 24px;background:#f1eee6;color:#7a6855;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.7;">
  <p style="margin:0 0 24px;font-size:22px;font-weight:700;">ooro.</p>
  <p style="margin:0 0 8px;font-size:18px;font-weight:700;">비밀번호를 다시 만들어 주세요</p>
  <p style="margin:0 0 24px;font-size:14px;">아래 버튼을 누르면 새 비밀번호를 정할 수 있어요. 링크는 일정 시간이 지나면 만료돼요.</p>
  <p style="margin:0 0 24px;">
    <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=recovery"
       style="display:inline-block;padding:14px 28px;background:#7a6855;color:#fcfbf8;border-radius:999px;text-decoration:none;font-size:14px;font-weight:600;">
      새 비밀번호 만들기
    </a>
  </p>
  <p style="margin:0;font-size:12px;">버튼이 눌리지 않으면 아래 주소를 브라우저에 붙여넣어 주세요.<br>
    <span style="word-break:break-all;">{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=recovery</span></p>
  <p style="margin:24px 0 0;font-size:12px;">비밀번호 재설정을 요청하지 않았다면 이 메일을 무시해 주세요. 비밀번호는 바뀌지 않아요.</p>
</div>
